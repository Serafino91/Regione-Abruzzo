
<app-table
  [data]="listaRichieste"
  [columns]="colonneRichieste"
  defaultSortColumn="requestId"
  defaultSortDir="asc">

  <ng-template #cellTemplate let-row let-col="column">
    @if (col.key === 'requestId') { <span class="fw-bold text-dark">{{ row.requestId }}</span>
    }

    @else if (col.key === 'state.config.label') {
      <span class="badge-stato"
        [style.border-color]="row.state?.config?.colorBorder"
        [style.background-color]="row.state?.config?.colorBg"
        [style.color]="row.state?.config?.colorText"> {{ row.state?.config?.label }}
      </span>
    }

    @else if (col.key === 'azioni') {
      <div class="dropdown text-center">
        <button class="btn btn-link p-0 text-decoration-none" type="button" data-bs-toggle="dropdown" aria-expanded="false" aria-label="Azioni progetto">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" width="20" height="20" fill="#0066CC">
            <path d="M9.5 13a1.5 1.5 0 1 1-3 0 1.5 1.5 0 0 1 3 0m0-5a1.5 1.5 0 1 1-3 0 1.5 1.5 0 0 1 3 0m0-5a1.5 1.5 0 1 1-3 0 1.5 1.5 0 0 1 3 0"/>
          </svg>
        </button>
        <ul class="dropdown-menu dropdown-menu-end">
          <li><a class="dropdown-item"  [routerLink]="['/home/richieste/dettaglio-richiesta', row.requestId]">Visualizza dettagli</a></li>
          <li><a class="dropdown-item" href="#">Modifica</a></li>
        </ul>
      </div>
    }

    @else {
      {{ getValue(row, col.key) }}
    }

  </ng-template>
</app-table>
