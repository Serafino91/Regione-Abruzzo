<app-table
  [data]="listaProgetti"
  [columns]="colonneProgetti"
  defaultSortColumn="idProgetto"
  defaultSortDir="asc">

    <ng-template #cellTemplate let-row let-col="column">

      @if (col.key === 'idProgetto') {
        <span class="fw-bold text-dark">{{ row.idProgetto }}</span>
      }

      @else if (col.key === 'azioni') {

        <button #trigger="appDropdownTrigger"
                class="btn btn-link p-0 text-decoration-none"
                type="button"
                aria-label="Azioni progetto"
                [appDropdownTrigger]="menuFileActions"
                [appDropdownTriggerContext]="{ row: row }">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" width="20" height="20" fill="#0066CC">
            <path d="M9.5 13a1.5 1.5 0 1 1-3 0 1.5 1.5 0 0 1 3 0m0-5a1.5 1.5 0 1 1-3 0 1.5 1.5 0 0 1 3 0m0-5a1.5 1.5 0 1 1-3 0 1.5 1.5 0 0 1 3 0"/>
          </svg>
        </button>

        <ng-template #menuFileActions let-row="row">
          <ul class="dropdown-menu dropdown-menu-end show" style="position: relative;">
            <li><a class="dropdown-item" [routerLink]="['/home/progetti/dettaglio-progetto', row.idProgetto]">Visualizza dettagli</a></li>
            <li><a class="dropdown-item" href="#">Modifica</a></li>
          </ul>
        </ng-template>

      } @else {
        {{ getValue(row, col.key) }}
      }

    </ng-template>
</app-table>
