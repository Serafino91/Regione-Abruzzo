<form [formGroup]="filtersForm" class="row p-2 mb-4 gap-3 align-items-end justify-content-evenly">

  <div class="col-4">
    <label class="active" for="id">ID Progetto</label>
    <input
      class="form-control form-control-rounded"
      formControlName="id"
      id="id"
      name="id">
  </div>

  <div class="col-4">
    <label class="active" for="id">Nome Progetto</label>
    <input
      class="form-control form-control-rounded"
      formControlName="nome"
      id="nome"
      name="nome">
  </div>

  <div class="col-2">
    <button type="button"
            class="btn btn-primary col-2  w-auto"
            (click)="cercaProgetti()">
      Cerca
    </button>
  </div>

</form>
