<form [formGroup]="filtersForm" class="row p-2 mb-4 gap-2 align-items-end">

  <div class="col-4">
    <label class="active" for="id">ID Progetto</label>
    <input
      class="form-control form-control-rounded"
      placeholder="Inserisci ID Progetto"
      type="text"
      formControlName="id"
      id="id">
  </div>

  <div class="col-4">
    <label class="active" for="nome">Nome Progetto</label>
    <input
      class="form-control form-control-rounded"
      placeholder="Inserisci Nome Progetto"
      type="text"
      formControlName="name"
      id="nome">
  </div>

  <div class="pt-4 row gap-2 justify-content-end ">
    <button type="button"
            class="btn btn-primary col-2 w-auto"
            (click)="resetFiltri()">
      Elimina filtri
    </button>

    <button
      type="button"
      class="btn btn-primary col-2  w-auto"
      (click)="applicaFiltri()">
      Cerca
    </button>
  </div>



</form>
