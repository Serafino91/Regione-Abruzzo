<form [formGroup]="formRichiesteTicket" #richiesteTicket="ngForm" class="row p-2 mb-4 gap-3 align-items-end">

    <div class="row">
        <div class="col-4">
            <label for="richiesta">Cerca ID richiesta</label>

            <div class="position-relative">
                <input type="text" id="richiesta" formControlName="idRichiesta"
                    class="form-control form-control-rounded pe-5" name="richiestaName" placeholder="Cerca ID richiesta"
                    autocomplete="off">

                <span class="position-absolute top-50 end-0 translate-middle-y me-3" style="pointer-events: none;">
                    <svg class="icon icon-primary icon-sm">
                        <use href="assets/bootstrap-italia/sprites.svg#it-search"></use>
                    </svg>
                </span>
            </div>
        </div>

        <div class="col-4">
            <label for="categoriaId">Categoria</label>

            <div class="position-relative">
                <select id="categoriaId" formControlName="categoria" (change)="setIdCategoria()"
                    class="form-select form-select-rounded">
                    <option value="0">Seleziona Categoria</option>

                    @for (categoria of categorie; track categoria.id) {
                    <option [value]="categoria.id">
                        {{ categoria.name + " - " + categoria.description }}
                    </option>
                    }
                </select>
            </div>
        </div>

        <div class="col-4">
            <label for="servizioId">Servizio</label>

            <div class="position-relative">
                <select id="servizioId" formControlName="servizio" class="form-select form-select-rounded">

                    <option value="0">Seleziona Servizio</option>

                    @for (servizio of servizi; track servizio.id) {
                    <option [value]="servizio.id">
                        {{ servizio.item }}
                    </option>
                    }
                </select>
            </div>
        </div>
    </div>

    <div class="row mt-3">
        <div class="col-4">
            <label for="statoRichiestaId">Stato richiesta</label>

            <div class="position-relative">
                <select id="statoRichiestaId" formControlName="statoRichiesta" class="form-select form-select-rounded">
                    <option value="0">Tutti</option>

                    @for (stato of statiRichiesta; track stato.id) {
                    <option [value]="stato.id">
                        {{ stato.content }}
                    </option>
                    }
                </select>
            </div>
        </div>

        <div class="col-4">
            <label for="DataInvioDaId">Data invio - da</label>

            <div class="position-relative">
                <input type="date" id="DataInvioDaId" name="DataInvioDaName" class="form-control form-control-rounded"
                    formControlName="dataInvioDa">
            </div>
        </div>

        <div class="col-4">
            <label for="DataInvioAId">Data invio - a</label>

            <div class="position-relative">
                <input type="date" id="DataInvioAId" name="DataInvioAName" class="form-control form-control-rounded"
                    formControlName="dataInvioA">
            </div>
        </div>
    </div>

    <div class="pt-4 row gap-2 justify-content-end ">
        <button type="button" class="btn btn-primary col-2 w-auto" (click)="eliminaFiltri()">
            Elimina filtri
        </button>

        <button type="button" class="btn btn-primary col-2  w-auto" (click)="applicaFiltri()">
            Applica filtri
        </button>
    </div>

</form>
