<app-section-header
  titolo="Progetti in corso"
  link="/home/progetti"
  testoLink="lista completa">
</app-section-header>

<div class="row g-3">
  @for (progetto of progetti; track progetto.idProgetto; let i = $index) {
    <div class="col-12 col-md-6 col-lg-4">
      <app-project-card
        [progetto]="progetto"
        [servizi]="progetto?.servizi?.length ?? 0"
        [richieste]="richieste[i]" >
      </app-project-card>
    </div>
  }
</div>
