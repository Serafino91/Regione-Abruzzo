<article class="progetto-card shadow-card">
  <p><strong> ID {{progetto.idProgetto}}</strong></p>
  <h6 class="progetto-card__title">{{progetto.nome }}</h6>
  <p> {{ progetto.description }}</p>


  <hr class="my-1">

  <div class="mt-3 d-flex justify-content-between">

    <div class="d-flex flex-column">
      <div class="d-flex flex-row gap-2 mb-0">
        <svg class="icon icon-sm icon-secondary ">
          <use href="assets/bootstrap-italia/sprites.svg#it-software"></use>
        </svg>
        <p class="color-grey fw-bold mb-0">Servizi</p>
      </div>
    <p class="color-grey  fw-bold mx-1"> {{servizi}}</p>
    </div>

    <div class="d-flex flex-column">
      <div class="d-flex flex-row gap-2 mb-0">
        <svg class="icon icon-sm icon-secondary ">
          <use href="assets/bootstrap-italia/sprites.svg#it-warning-circle"></use>
        </svg>
        <p class="color-grey fw-bold mb-0">Richieste</p>
      </div>
      <p class="color-grey fw-bold mx-1"> {{richieste}}</p>
    </div>

  </div>


  <a (click)="apriDettaglio()" class="progetto-card__link mt-3 fw-semibold">
    Dettaglio progetto <span aria-hidden="true">→</span>
  </a>
</article>
