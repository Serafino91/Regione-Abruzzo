<article class="progetto-card">
  <p><strong> ID {{id}}</strong></p>
  <h6 class="progetto-card__title">{{nome }}</h6>
  <p> {{ progetto.description }}</p>


  <hr class="my-1">

  <div class="mt-3 d-flex justify-content-between ">

    <div class="d-flex align-items-start">
      <svg class="icon icon-sm me-2">
        <use href="assets/bootstrap-italia/sprites.svg#it-software"></use>
      </svg>

      <div>
        <strong class="d-block">Servizi:</strong>
        <span class="fw-semibold">{{ progetto.destinationLink }}</span>
      </div>
    </div>

    <div class="d-flex align-items-start">
      <svg class="icon icon-sm me-2">
        <use href="assets/bootstrap-italia/sprites.svg#it-warning-circle"></use>
      </svg>

      <div>
        <strong class="d-block">Richieste attive:</strong>
        <span class="fw-semibold">{{ progetto.dataCreazione }}</span>
      </div>
    </div>


  </div>


  <a href="#" class="progetto-card__link mt-3">
    Dettaglio progetto <span aria-hidden="true">→</span>
  </a>
</article>
