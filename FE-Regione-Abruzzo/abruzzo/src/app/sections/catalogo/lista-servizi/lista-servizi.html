<div class=" services-toolbar d-flex justify-content-between align-items-center mb-2">

  <div class="d-flex align-items-center gap-3">

    <div class="d-flex align-items-center gap-2 text-uppercase fw-bold text-secondary">
      <span>Visualizza</span>

      <select
        class="form-select form-select-rounded form-select-sm d-inline-block w-auto border-secondary-subtle"
        [ngModel]="pageSize"
        (ngModelChange)="onPageSizeChange($event)"
        style="color: #002b55;">
        <option [ngValue]="3">3 per pagina</option>
        <option [ngValue]="6">6 per pagina</option>
        <option [ngValue]="9">9 per pagina</option>
        <option [ngValue]="12">12 per pagina</option>
      </select>
    </div>

    <span class="text-uppercase fw-bold text-secondary">Totale: {{ servizi.length }}</span>
  </div>

  <div class="d-flex align-items-center gap-2">
    <button
      class="btn btn-link p-1"
      [disabled]="currentPage === 1"
      (click)="previousPage()">

      <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18"
           fill="currentColor" viewBox="0 0 16 16">
        <path fill-rule="evenodd"
              d="M11.354 1.646a.5.5 0 0 1 0 .708L5.707 8l5.647 5.646a.5.5 0 0 1-.708.708l-6-6a.5.5 0 0 1 0-.708l6-6a.5.5 0 0 1 .708 0z"/>
      </svg>
    </button>

    <span class="px-3 py-1 border rounded">
      {{ currentPage }}
    </span>
    / {{totalPages}}

    <button
      class="btn btn-link p-1"
      [disabled]="currentPage >= totalPages"
      (click)="nextPage()">

      <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18"
           fill="currentColor" viewBox="0 0 16 16">
        <path fill-rule="evenodd"
              d="M4.646 1.646a.5.5 0 0 1 .708 0l6 6a.5.5 0 0 1 0 .708l-6 6a.5.5 0 0 1-.708-.708L10.293 8 4.646 2.354a.5.5 0 0 1 0-.708z"/>
      </svg>
    </button>
  </div>

</div>

<div class="row g-4">
  @for (servizio of  paginatedServizi; track servizio.id) {
    <div class="col-12 col-md-6 col-lg-4">
      <app-servizio-card
        [servizio]="servizio">
      </app-servizio-card>
    </div>
  }
</div>
