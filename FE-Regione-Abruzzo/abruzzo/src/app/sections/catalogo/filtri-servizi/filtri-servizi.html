<form [formGroup]="filtersForm" class="row p-2 mb-4 gap-2 align-items-end">


    <div class="col-12 col-md-5">
      <label for="categoria" >Categoria</label>
      <select id="categoria"
              class="form-select form-select-rounded"
              formControlName="categoria">
        <option value="">Seleziona Categoria</option>
        @for (categoria of categorie; track categoria.id) {
          <option [value]="categoria.id">
            {{ categoria.name + " - " + categoria.description }}
          </option>
        }
      </select>
    </div>

    <div class="col-12 col-md-3">
      <label for="servizio" >Servizio</label>
      <select id="servizio"
              class="form-select form-select-rounded"
              formControlName="servizio"
              [disabled]="servizi.length === 0">
        <option value="">Seleziona Servizio</option>
        @for (servizio of servizi; track servizio.id) {
          <option [value]="servizio.id">
            {{ servizio.item }}
          </option>
        }
      </select>
    </div>

    <button type="button"
            class="btn btn-primary col-2 w-auto ms-auto"
            (click)="resetFiltri()">
      Elimina filtri
    </button>

    <button
      type="button"
      class="btn btn-primary col-2  w-auto"
      (click)="applicaFiltri()">
      Cerca
    </button>


</form>
