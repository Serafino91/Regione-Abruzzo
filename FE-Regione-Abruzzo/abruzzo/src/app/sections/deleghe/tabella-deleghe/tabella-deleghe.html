<app-table
  [data]="deleghe"
  [columns]="colonneDeleghe"
  defaultSortColumn="idProgetto"
  defaultSortDir="asc">

  <ng-template #cellTemplate let-row let-col="column">

    @if (col.key === 'idDelega') {
      <span class="fw-bold text-dark">{{ row.idProgetto }}</span>
    }
    @else if (col.key === 'azioni') {

      <div class="d-flex flex-row justify-content-evenly">
        <button type="button" class="btn btn-link p-0 text-decoration-none" >
          <svg class="icon icon-primary icon-sm me-1" aria-hidden="true">
            <use href="assets/bootstrap-italia/sprites.svg#it-zoom-in"></use>
          </svg>
        </button>

        <button type="button" class="btn btn-link p-0 text-decoration-none" >
          <svg class="icon icon-primary icon-sm me-1" aria-hidden="true" >
            <use href="assets/bootstrap-italia/sprites.svg#it-tool"></use>
          </svg>
        </button>

      </div>

    } @else {
      {{ getValue(row, col.key) }}
    }

  </ng-template>
</app-table>
