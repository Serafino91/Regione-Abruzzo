<app-spinner-card [isLoading]="isLoading"></app-spinner-card>

<div class="section-padding">
<app-page-header
  [titolo]="'Gestione Richieste'"
  [sottotitolo]="'Puoi consultare tutte le richieste inviate, sia in corso che concluse, utilizzando i filtri disponibili.'"
  [link]="'/home/richieste/nuova-richiesta'"
  [button]="'Nuova richiesta'">
</app-page-header>
</div>


<div class="color-bg-lightblue section-padding">
  <app-filtri
    (filtra)="onFiltra($event)"
    (reset)="onResetFiltri()">>
  </app-filtri>
</div>

<div class="section-padding mb-4 ">
    <app-tabella-richieste
      [richieste]="listaRichieste">
    </app-tabella-richieste>

  <hr class="line-separator m-0">
</div>
