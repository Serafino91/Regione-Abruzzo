<div class="section-padding d-flex flex-column gap-2">
  <app-page-header
    [titolo]="'Nuovo Incident'"
    [sottotitolo]="'Compila tutti i dati per creare un nuovo incident'">
  </app-page-header>

  <form [formGroup]="incidentForm">

    <div class="section-padding color-bg-lightgrey">

      <div class="row g-4 mb-4">

        <h5>Dati Incident</h5>

        <div class="col-6">
          <label for="categoria" >Categoria</label>
          <select
            class="form-select form-select-rounded"
            formControlName="categoria">
            <option value="">Seleziona...</option>
          </select>
        </div>

        <div class="col-6">
          <label for="sottocategoria" >Sottocategoria</label>
          <select
            class="form-select form-select-rounded"
            formControlName="sottocategoria">
            <option value="">Seleziona...</option>
          </select>
        </div>

        <div class="col-6">
          <label for="idProgetto" >ID Progetto</label>
          <select
            class="form-select form-select-rounded"
            formControlName="idProgetto">
            <option value="">Seleziona...</option>
          </select>
        </div>

        <div class="col-6">
          <label for="idServizio" >ID Servizio</label>
          <select
            class="form-select form-select-rounded"
            formControlName="idServizio">
            <option value="">Seleziona...</option>
          </select>
        </div>


        <div class="col-12">
        <label for="descrizione" >Descrizione problema</label>
        <textarea
            id="descrizione"
            class="mt-0 form-control form-control-rounded "
            rows="5"
            formControlName="descrizione"
            [attr.maxlength]="maxNoteLength">
        </textarea>

          <div class="d-flex justify-content-end">
            <small class="text-muted">
              {{ incidentForm.get('descrizione')?.value?.length || 0 }}/{{ maxNoteLength }}
            </small>
          </div>
        </div>

        <div class="col-12">
        <input
          type="file"
          id="allegato"
          class="d-none"
          formControlName="file"
          (change)="onFileSelected($event)"/>

        <label for="allegato" class="upload-area">
          <svg class="icon icon-sm me-2" aria-hidden="true">
            <use href="assets/bootstrap-italia/sprites.svg#it-upload"></use>
          </svg>

          <span>Trascina qui il file da allegare o clicca per scegliere</span>
        </label>
      </div>
        <hr>

        <h5>Dati Richiedente</h5>
        <div class="col-12">
          <label for="sede" >Sede</label>
          <input
            id="sede"
            type="text"
            formControlName="sede"
            class="form-control form-control-rounded">
        </div>

        <div class="col-6">
          <label for="email" >E-mail</label>
          <input
            id="email"
            type="text"
            formControlName="email"
            class="form-control form-control-rounded">
        </div>


        <div class="col-6">
          <label for="telefono" >Telefono</label>
          <input
            id="telefono"
            type="text"
            formControlName="telefono"
            class="form-control form-control-rounded">
        </div>
      </div>
    </div>
  </form>
  <div class="line-separator"></div>
  <div class="section-footer">
      <div>
        <button
          class="btn btn-outline-primary">
          Annulla
        </button>
      </div>

      <button
        class="btn btn-outline-primary">
        Invia
      </button>


</div>

</div>
