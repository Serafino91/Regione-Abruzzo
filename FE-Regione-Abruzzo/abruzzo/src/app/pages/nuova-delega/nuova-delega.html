<div class="section-padding">
  <app-url></app-url>
  <div class="d-flex justify-content-between align-items-center mb-4">
    <h4 class="title-section"> <strong>Nuova delega</strong></h4>
  </div>
  <app-wizard-bar
    [currentStep]="currentStep"
    [items]="wizardItems">
  </app-wizard-bar>
</div>



@if(currentStep === 1) {
  <app-scegli-utenza
    [formGroup]="delegaForm.controls['utenzaForm']">
  </app-scegli-utenza>
}
@if(currentStep === 2) {
  <app-seleziona-progetti
    [formGroup]="delegaForm.controls['progettiForm']">
  </app-seleziona-progetti>
}
@if(currentStep === 3) {
  <app-controlla-dati
    [formGroup]="delegaForm">>
  </app-controlla-dati>
}


<app-section-footer
  [currentStep]="currentStep"
  [canGoNext]="canGoNext()"
  (next)="nextStep()"
  (previous)="previousStep()">
</app-section-footer>
