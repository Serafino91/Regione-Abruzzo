<div class="info-bar">

  <div class="info-card">
    <svg class="info-icon" aria-hidden="true">
      <use href="assets/bootstrap-italia/sprites.svg#it-file"></use>
    </svg>
    <div class="info-content">
      <span class="info-label">ID richiesta</span>
      <span class="info-value">{{ richiesta.requestId }}</span>
    </div>
  </div>

  <div class="info-card">
    <svg class="info-icon" aria-hidden="true">
      <use href="assets/bootstrap-italia/sprites.svg#it-arrow-up-right"></use>
    </svg>
    <div class="info-content">
      <span class="info-label">Stato</span>
      <span class="info-value">{{ richiesta.state?.stateName }}</span>
    </div>
  </div>

  <div class="info-card">
    <svg class="info-icon" aria-hidden="true">
      <use href="assets/bootstrap-italia/sprites.svg#it-calendar"></use>
    </svg>
    <div class="info-content">
      <span class="info-label">Data apertura</span>
      <span class="info-value">{{ richiesta.createdAt | date:'dd/MM/yyyy' }}</span>
    </div>
  </div>

</div>
