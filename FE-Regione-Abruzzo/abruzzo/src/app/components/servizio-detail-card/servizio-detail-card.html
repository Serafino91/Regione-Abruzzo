<div class="shadow-card p-4 border-4 rounded">

  <div class="d-flex flex-row align-items-center">
    <svg class="icon icon-sm me-2 ">
      <use href="assets/bootstrap-italia/sprites.svg#it-code-circle"></use>
    </svg>
    <h5 class="mb-0">Dati Servizio </h5>
  </div>


  <div class="row gap-4 mt-2">

    <div class="col-3">
      <p class="fw-bold mb-1">Id servizio</p>
      <p class="mb-0">{{ servizio?.id }}</p>
    </div>

    <div class="col-3">
      <p class="fw-bold mb-1">Servizio</p>
      <p class="mb-0">{{ servizio?.item }}</p>
    </div>

    <div class="col-3">
      <p class="fw-bold mb-1">Categoria</p>
      <p class="mb-0">{{ servizio?.type?.name }}</p>
    </div>

  </div>
  <hr>



  @if (servizio?.params?.length) {
    <div class="d-flex flex-row align-items-center">
      <svg class="icon icon-sm me-2">
        <use href="assets/bootstrap-italia/sprites.svg#it-software"></use>
      </svg>
      <h5 class="mb-0">Parametri </h5>
    </div>
    <div class="row gap-4 mt-2">
      @for (param of servizio?.params; track param.id) {
        <div class="col-3">
          <p class="fw-bold mb-1">{{ param.name }}</p>
          <p class="mb-0">{{ param.paramType }}</p>
        </div>
      }
    </div>
  }

</div>
